# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
# Listen on all network interfaces (so phones/tablets on same WiFi can connect)
server.address=0.0.0.0

# ── MySQL Database ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/alammoah?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=AlamMoAhSyntaxWikiSuperSecretKeyForJWTTokenGeneration2024ITStudents
app.jwt.expiration=86400000

# ── CORS — allow all origins so phones/tablets can connect ───────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
